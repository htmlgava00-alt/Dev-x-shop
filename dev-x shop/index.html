select.f{width:100%;padding:10px 14px;border:2px solid var(--bd);border-radius:16px;font:inherit;background:var(--cd);color:var(--tx)}select.f:focus{border-color:var(--bl)}
input.f[readonly]{opacity:.7}
/* ===== profile ===== */
.av{width:72px;height:72px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;overflow:hidden;flex:none;border:3px solid var(--bl)}
.av img{width:100%;height:100%;object-fit:cover;display:block}.av.s{width:22px;height:22px;font-size:12px;border-width:0}
.pill.acc{display:inline-flex;align-items:center;gap:6px;text-decoration:none;max-width:140px}.pill.acc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.pill.acc{padding:3px 10px 3px 6px;gap:4px}}
.pfh{display:flex;gap:14px;align-items:center;padding:16px;max-width:640px;margin:10px 0}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:10px 0}
.pst a{text-align:center;padding:12px 6px;border:2px solid var(--bd);border-radius:20px;background:var(--cd);color:var(--tx);font-size:13px}.pst b{display:block;font-size:20px;line-height:1.3}
.pact{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}

 const ph=$('#phs');let phone='';
 const step1=()=>{ph.innerHTML=`<form id="pf" class="fm" novalidate><label for="pn">${ae('رقم الموبايل','Mobile number')}</label><div class="pin"><b>🇪🇬 +20</b><input id="pn" type="tel" inputmode="numeric" autocomplete="tel-national" dir="ltr" placeholder="01X XXXX XXXX" maxlength="16"></div><div class="er" id="pe" aria-live="polite"></div><button class="btn w" id="ps">${ae('إرسال كود التحقق','Send verification code')}</button></form>`;
  $('#pf').onsubmit=async e=>{e.preventDefault();const n=normPhone($('#pn').value),er=$('#pe'),b=$('#ps');er.textContent='';
   if(!n){er.textContent=ae('أدخل رقم موبايل مصري صحيح (مثل 01012345678)','Enter a valid Egyptian mobile number (e.g. 01012345678)');$('#pn').setAttribute('aria-invalid',1);return}
   b.disabled=true;try{await otpSend(n);phone=n;step2()}catch(x){er.textContent=x===1?ae('خدمة الرسائل غير متاحة حاليًا.','SMS service is unavailable right now.'):ae('تعذّر إرسال الكود. حاول مرة أخرى.','Could not send the code. Try again.');b.disabled=false}}};
 const step2=()=>{ph.innerHTML=`<form id="vf" class="fm" novalidate><p style="margin:0">${ae('أرسلنا كودًا من 6 أرقام إلى','We sent a 6-digit code to')} <b dir="ltr">${fmtPhone(phone)}</b></p><label for="oc">${ae('كود التحقق','Verification code')}</label><input class="f otp" id="oc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr"><div class="er" id="oe" aria-live="polite"></div><button class="btn w" id="ov">${ae('تأكيد','Verify')}</button><p style="display:flex;justify-content:space-between;margin:6px 0 0"><a href="#" id="chg">${ae('تغيير الرقم','Change number')}</a><a href="#" id="rs"></a></p></form>`;

/* ===== motion: soft ripple on tap; short delay so the wave is seen before navigating ===== */
(()=>{const RM={matches:false},HOST='.ph,.dimg,.btn,.chip,.pill,.cats a,.tr .im,.tr a,.tr button,.cartb,.qs button,.ar,.pmo,nav a,#bt a,.hr,.sz button,.pst a,.abtn,.pc';let last=null,navT=0;
 document.addEventListener('pointerdown',e=>{if(RM.matches||e.button>0)return;const h=e.target.closest&&e.target.closest(HOST);if(!h||h.disabled)return;
  const r=h.getBoundingClientRect(),cs=getComputedStyle(h),d=Math.round(Math.max(r.width,r.height)*2.2);
  if(cs.position==='static')h.style.position='relative';if(cs.overflow==='visible')h.style.overflow='hidden';
  const sp=document.createElement('span');sp.className='rip';sp.style.cssText='--d:'+d+'px;--x:'+(e.clientX-r.left)+'px;--y:'+(e.clientY-r.top)+'px';h.appendChild(sp);last=sp;setTimeout(()=>sp.remove(),1100)},{passive:true});
 document.addEventListener('pointercancel',()=>{if(last)last.remove()},{passive:true});
 document.addEventListener('click',e=>{if(RM.matches||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;const a=e.target.closest('.pc a[href^="#"],.tr a[href^="#"],.cats a[href^="#"]');if(!a)return;e.preventDefault();if(navT)return;const href=a.getAttribute('href');navT=setTimeout(()=>{navT=0;location.hash=href},220)});
})();
